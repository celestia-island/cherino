name: Checks

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Check
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check compilation
        run: cargo check --workspace --all-features

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-features --tests -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check
