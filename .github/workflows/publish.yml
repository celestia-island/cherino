name: Publish crates.io

on:
  push:
    tags: [v*]

# One in-flight run per ref: runs serialize — a superseded push
# queues behind the current one (deploys/publishes are never
# interrupted mid-flight).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # ── Refuse to publish anything but the version the tag names ────────────-
  # Before this job the skip guards probed the TAG version while
  # `cargo publish` shipped the MANIFEST version — the two could diverge
  # silently (versioning-audit W4, 2026-11-04; the release lane had been
  # idle since before the current workflow shape existed).
  verify-version:
    name: Verify version matches tag
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "0"
      - name: Compare tag with the workspace manifest
        run: |
          WANT="${GITHUB_REF_NAME#v}"
          HAVE=$(awk '
            /^\[workspace\.package\]/ { in_ws = 1; next }
            /^\[/ { in_ws = 0 }
            in_ws && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }' Cargo.toml)
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::workspace version ($HAVE) != tag version ($WANT)"
            exit 1
          fi
          echo "Publishing version $HAVE"

  # ── Semver gate: first release diffs nothing (no crates.io baseline),
  #    printed as a notice; from the second release on, a tag whose API
  #    diff requires a bigger bump never reaches crates.io
  #    (versioning-audit B2, 2026-11-04). Pinned devtools ref per H14.
  semver-checks:
    name: Semver API diff (published crates)
    uses: celestia-island/celestia-devtools/.github/workflows/semver-checks.yml@ff571025fd669a3474446c7b7bb6fe29f5153336
    with:
      runs-on-json: '["self-hosted", "linux", "x64", "local"]'

  # The publish lane runs on the clean hosted runners (hare precedent):
  # the self-hosted fleet's cargo configuration chain carries the rsproxy
  # source replacement via a parent-directory config that no workflow-level
  # CARGO_HOME can mask (job env AND a GITHUB_ENV re-pin both verified
  # ineffective across the v0.1.1-v0.1.3 runs — cargo resolves config from
  # the manifest's parent-directory chain, which is runner-machine-owned).
  # A release should not fight that, and should not queue behind unrelated
  # build jobs either.
  publish:
    name: Publish to crates.io
    needs: [verify-version, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: "0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Topological order: cherino-macros -> cherino -> cherino-runtime.
      # Per-crate skip guards make a retried tag run idempotent when an
      # earlier step already succeeded; the crates.io API requires a
      # User-Agent header (403 otherwise).
      - name: Verify workspace
        run: cargo check --workspace --all-features

      - name: Publish cherino-macros
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "User-Agent: celestia-island" "https://crates.io/api/v1/crates/cherino-macros/${VERSION}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::cherino-macros ${VERSION} already published — skipping."
          else
            cargo publish -p cherino-macros --token ${{ secrets.CRATES_IO_API_TOKEN }}
          fi

      - name: Wait for the crates.io index to see cherino-macros
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "User-Agent: celestia-island" "https://crates.io/api/v1/crates/cherino-macros/${VERSION}" || echo "000")
            [ "$STATUS" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::cherino-macros ${VERSION} never appeared on crates.io within 5 minutes."
          exit 1

      - name: Publish cherino
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "User-Agent: celestia-island" "https://crates.io/api/v1/crates/cherino/${VERSION}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::cherino ${VERSION} already published — skipping."
          else
            cargo publish -p cherino --token ${{ secrets.CRATES_IO_API_TOKEN }}
          fi

      - name: Wait for the crates.io index to see cherino
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "User-Agent: celestia-island" "https://crates.io/api/v1/crates/cherino/${VERSION}" || echo "000")
            [ "$STATUS" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::cherino ${VERSION} never appeared on crates.io within 5 minutes."
          exit 1

      - name: Publish cherino-runtime
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -H "User-Agent: celestia-island" "https://crates.io/api/v1/crates/cherino-runtime/${VERSION}" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "::warning::cherino-runtime ${VERSION} already published — skipping."
          else
            cargo publish -p cherino-runtime --token ${{ secrets.CRATES_IO_API_TOKEN }}
          fi
